name: Validate FDE Orange Book

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check structure and local links
        run: python3 scripts/validate_kb.py
      - name: Test the original offline capstone
        run: python3 -m unittest discover -s examples/material_assistant -v
      - name: Verify chapter Python examples
        run: python3 scripts/verify_code_samples.py
      - name: Install PDF inspector
        run: python -m pip install pypdf
      - name: Check book and PDF consistency
        run: python3 scripts/validate_book.py
